[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regkit"
version = "0.1.0"
description = "Reusable utilities for multivariate, vector-valued polynomial regression."
readme = { text = "RegKit packages polynomial regression utilities.", content-type = "text/plain" }
requires-python = ">=3.12"
authors = [
    { name = "RegKit Authors" }
]
dependencies = [
    "numpy",
    "scikit-learn",
    "matplotlib",
    "plotly",
    "tqdm",
    "sympy",
]

[project.urls]
Homepage = "https://example.com/regkit"
Source = "https://example.com/regkit/source"

[tool.setuptools.packages.find]
where = ["src"]
include = ["regkit*"]
